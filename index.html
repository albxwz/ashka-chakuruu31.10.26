<script async>
    // Получаем модальное окно, кнопку и аудио
    var modal = document.getElementById("musicModal");
    var playButton = document.getElementById("playMusic");
    var audio = document.getElementById("backgroundMusic");

    // При нажатии на кнопку включаем музыку и закрываем модальное окно
    playButton.onclick = function() {
        audio.play();
        closeModal();
    };

    // Функция для закрытия модального окна и разблокировки сайта
    function closeModal() {
        modal.style.display = "none";  // Скрываем модальное окно
        document.body.classList.remove("modal-open"); // Включаем прокрутку
    }
</script>

  <script async>
    document.addEventListener("DOMContentLoaded", function() {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      });

      var elements = document.querySelectorAll(".fade-in");
      elements.forEach(function(element) {
        observer.observe(element);
      });
    });
  </script>


<script async>





     function onEntry(entry) { 
      entry.forEach(change => { 
        if (change.isIntersecting) { 
         change.target.classList.add('element-show'); 
         
        } 
      }); 
    } 
        let options = { 
      threshold: [0.5] }; 
    let observer = new IntersectionObserver(onEntry, options); 
    let elements = document.querySelectorAll('.element-animation'); 
     
    for (let elm of elements) { 
      observer.observe(elm); 
    }












</script>
